name: Install licensed humanoid character
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-humanoid-avatar.yml'
permissions:
  contents: write
jobs:
  character:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate CC0 rigged humanoid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realistic-assets/characters
          curl --fail --location --retry 3 --max-time 120 'https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb' -o realistic-assets/characters/zerconda-humanoid.glb
          test "$(head -c 4 realistic-assets/characters/zerconda-humanoid.glb)" = glTF
          test "$(stat -c%s realistic-assets/characters/zerconda-humanoid.glb)" -gt 20000
          cat > realistic-assets/characters/SOURCE.txt <<'EOF'
          Character source: https://github.com/programasweights/avatar
          Original character: Quaternius Universal Base Characters / Superhero Male
          License: CC0 1.0 (public domain)
          https://quaternius.com/packs/universalbasecharacters.html
          EOF
      - name: Commit downloaded model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realistic-assets/characters/
          git diff --cached --quiet || git commit -m "Add CC0 rigged 3D humanoid character asset"
          git pull --rebase origin main
          git push origin HEAD:main
