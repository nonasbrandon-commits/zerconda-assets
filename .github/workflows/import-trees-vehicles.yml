name: Import realistic trees and unbranded vehicles
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-trees-vehicles.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender for optimized 3D tree exports
        run: sudo apt-get update -qq && sudo apt-get install -y blender >/dev/null
      - name: Download and validate genuine CC0 assets
        run: |
          cat > /tmp/assets.py <<'PY'
          import json,urllib.request,urllib.error,pathlib,subprocess,os,shutil
          root=pathlib.Path('realistic-assets/trees-and-vehicles');root.mkdir(parents=True,exist_ok=True)
          report={'vehicles':{},'trees':{}}
          UA={'User-Agent':'Mozilla/5.0 (Zerconda CC0 asset importer)'}
          def get(url,limit=160000000):
              with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=160) as r:
                  data=r.read(limit+1)
              if len(data)>limit:raise ValueError('Download exceeds safety limit')
              return data
          vehicles={
            'starter-white-sedan':'white-four-door-sedan-1f271353',
            'starter-graphite-sedan':'graphite-four-door-sedan-eed96d12',
            'generic-sedan':'sedan-car-42109739',
            'sports-supercar':'generic-mid-engine-supercar-73f252c5',
            'generic-police-sedan':'police-sedan-with-generic-livery-8770d8f3'
          }
          for label,slug in vehicles.items():
              url='https://www.innerscene.com/api/library/'+slug+'/download'
              try:
                  data=get(url,24000000)
                  if data[:4]!=b'glTF':raise ValueError('Not a GLB binary')
                  path=root/'vehicles'/ (label+'.glb')
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
                  report['vehicles'][label]={'status':'downloaded','bytes':len(data),'source':'https://www.innerscene.com/tools/library/3d-parts/'+slug,'license':'CC0'}
              except Exception as e:report['vehicles'][label]={'status':'failed','reason':str(e)}
          blender_script=pathlib.Path('/tmp/optimize_tree.py')
          blender_script.write_text(__import__("textwrap").dedent("""
          import bpy,sys,os
          args=sys.argv[sys.argv.index('--')+1:]
          src,dst=args
          bpy.ops.object.select_all(action='SELECT');bpy.ops.object.delete(use_global=False)
          bpy.ops.import_scene.gltf(filepath=src)
          meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']
          for obj in meshes:
              faces=len(obj.data.polygons)
              if faces>100000:
                  bpy.context.view_layer.objects.active=obj
                  mod=obj.modifiers.new('Zerconda optimized foliage','DECIMATE')
                  mod.ratio=max(0.02,min(1.0,100000/faces))
                  bpy.ops.object.modifier_apply(modifier=mod.name)
          bpy.ops.export_scene.gltf(filepath=dst,export_format='GLB',export_image_format='JPEG',export_texcoords=True,export_normals=True,export_materials='EXPORT',export_yup=True)
          print('EXPORT',dst,os.path.getsize(dst))
          """))
          for label,asset in [('leafy-small-tree','tree_small_02'),('leafy-jacaranda','jacaranda_tree'),('leafy-fir','fir_tree_01'),('leafy-island-tree','island_tree_01')]:
              tmp=pathlib.Path('/tmp/zerconda-tree-'+label)
              try:
                  files=json.loads(get('https://api.polyhaven.com/files/'+asset,5000000))
                  options=[]
                  def walk(obj,path=()):
                      if isinstance(obj,dict):
                          if isinstance(obj.get('url'),str) and obj['url'].split('?')[0].lower().endswith('.gltf'):options.append((path,obj))
                          else:
                              for k,v in obj.items():walk(v,path+(k,))
                  walk(files)
                  options=[(p,v) for p,v in options if 'gltf' in [str(x).lower() for x in p]]
                  options.sort(key=lambda pv:(0 if '1k' in [str(x).lower() for x in pv[0]] else 1,len(pv[0])))
                  if not options:raise ValueError('No glTF variant found')
                  node=options[0][1]
                  tmp.mkdir(parents=True,exist_ok=True)
                  gltf=tmp/node['url'].split('?')[0].rsplit('/',1)[-1]
                  gltf.write_bytes(get(node['url']))
                  for name,dep in node.get('include',{}).items():
                      if not isinstance(dep,dict) or 'url' not in dep:continue
                      path=tmp/name
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(get(dep['url']))
                  doc=json.loads(gltf.read_text())
                  for obj in doc.get('buffers',[])+doc.get('images',[]):
                      uri=obj.get('uri','')
                      if not uri or uri.startswith('data:'):continue
                      target=tmp/uri
                      if not target.exists():
                          matches=list(tmp.rglob(pathlib.PurePosixPath(uri).name))
                          if len(matches)==1:
                              target.parent.mkdir(parents=True,exist_ok=True)
                              shutil.copy2(matches[0],target)
                      if not target.exists():raise ValueError('Missing dependency '+uri)
                  dest=root/'trees'/(label+'.glb')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  p=subprocess.run(['blender','-b','--python',str(blender_script),'--',str(gltf),str(dest)],capture_output=True,text=True,timeout=350)
                  if p.returncode:raise ValueError('Blender conversion failed: '+(p.stderr+p.stdout)[-1200:])
                  if dest.stat().st_size>24000000:
                      dest.unlink();raise ValueError('Optimized GLB exceeds 24 MB')
                  if dest.read_bytes()[:4]!=b'glTF':raise ValueError('Invalid exported GLB')
                  report['trees'][label]={'status':'downloaded','bytes':dest.stat().st_size,'source':'https://polyhaven.com/a/'+asset,'license':'CC0'}
              except Exception as e:report['trees'][label]={'status':'failed','reason':str(e)}
              finally:shutil.rmtree(tmp,ignore_errors=True)
          (root/'IMPORT_REPORT.json').write_text(json.dumps(report,indent=2))
          (root/'README.md').write_text('# Zerconda CC0 trees and unbranded vehicles\n\nThese are real third-party authored 3D models, not screenshots or procedural placeholders. Check IMPORT_REPORT.json for success and original license sources. Vehicle wheels are model meshes; driving controls and wheel animation must be implemented separately. Trees are optimized for browser use and should be visually approved before deployment.\n')
          print(json.dumps(report,indent=2))
          PY
          python3 /tmp/assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realistic-assets/trees-and-vehicles
          git diff --cached --quiet || (git commit -m "Add real CC0 3D leafy trees and unbranded cars with audit report" && git push)
          python3 - <<'PY'
          import json
          d=json.load(open('realistic-assets/trees-and-vehicles/IMPORT_REPORT.json'))
          assert any(x['status']=='downloaded' for x in d['vehicles'].values()),'No vehicles imported'
          assert any(x['status']=='downloaded' for x in d['trees'].values()),'No leafy trees imported'
          PY
