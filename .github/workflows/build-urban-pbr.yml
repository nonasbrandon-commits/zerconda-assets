name: Build CC0 urban PBR asset library
on:
  push:
    paths:
      - 'world-v5-upgrade/download-urban-pbr.py'
      - '.github/workflows/build-urban-pbr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python world-v5-upgrade/download-urban-pbr.py
      - name: Commit actual downloaded texture images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realistic-assets/urban-pbr/
          if ! git diff --cached --quiet; then
            git commit -m "Add CC0 1K PBR city brick concrete asphalt sidewalk textures"
            git push
          fi
