<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zerconda Apartment Lobby Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#b8cbd5;font:14px system-ui}#note{position:fixed;top:12px;left:12px;background:#14222ddd;color:white;padding:12px 18px;border-radius:9px;z-index:3}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script></head><body><div id="note"><strong>ZERCONDA · APARTMENT LOBBY</strong><p>Drag to orbit · Scroll to zoom · Preview of original 3D interior assets</p></div><script type="module">
import * as THREE from 'three';
import {createApartmentLobby} from './apartment-interiors.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8cbd5);
scene.add(new THREE.HemisphereLight(0xffffff,0x8e9193,3));
const sun=new THREE.DirectionalLight(0xfff0d8,3);sun.position.set(7,15,9);scene.add(sun);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.appendChild(renderer.domElement);
const lobby=createApartmentLobby({scene,floors:3});lobby.root.children.filter(o=>o.isMesh&&o.position.y>3.8&&o.scale.x>10).forEach(o=>o.visible=false);
let az=.6,el=.62,dist=24,drag=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-lastX)*.007;el=THREE.MathUtils.clamp(el+(e.clientY-lastY)*.006,.12,1.4);lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.025,8,55)},{passive:true});
function frame(){requestAnimationFrame(frame);camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+2,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,2,0);renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
